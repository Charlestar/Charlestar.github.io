# Site identity
title: Charlestar
SEOTitle: 子辰的技术笔记 | AI Infra 与大模型推理
description: 深入拆解大模型推理系统、GPU 优化与云原生工程实践。
keyword: AI Infra,LLM 推理,vLLM,SGLang,FlashInfer,CUDA,云原生
url: https://charlestar.github.io
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: 子辰
  handle: Charlestar
  email: charlestarzhang@gmail.com

github_username: Charlestar
twitter_username: Charles03838116
github_repo: https://github.com/Charlestar/Charlestar.github.io

# Content
permalink: pretty
paginate: 10
paginate_path: /page:num/
featured-tags: true
featured-condition-size: 0

# Build
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

# Comments
giscus:
  enable: true
  repo: Charlestar/Charlestar.github.io
  repo-id: MDEwOlJlcG9zaXRvcnkyMzg0NzE4OTU=
  category: Announcements
  category-id: DIC_kwDODjbK184C9GBS
  mapping: og:title
  strict: "0"
  reactions-enabled: "1"
  emit-metadata: "0"
  input-position: bottom
  lang: zh-CN
  loading: lazy

pwa:
  enabled: true
  theme_color: "#0f766e"

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
