<footer class="site-footer">
  <div class="shell footer-grid">
    <div>
      <a class="footer-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p>{{ site.description }}</p>
    </div>
    <div class="footer-links" aria-label="外部链接">
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      {% if site.twitter_username %}<a href="https://x.com/{{ site.twitter_username }}" target="_blank" rel="noopener noreferrer">X ↗</a>{% endif %}
      <a href="mailto:{{ site.author.email }}">Email</a>
    </div>
  </div>
  <div class="shell footer-meta">
    <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}</span>
    <span>Built thoughtfully with Jekyll.</span>
  </div>
</footer>
