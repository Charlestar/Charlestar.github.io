<header class="site-header" data-site-header>
  <div class="shell nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} 首页">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span class="brand-copy">
        <strong>{{ site.title }}</strong>
        <small>Systems · AI Infra</small>
      </span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span class="sr-only">打开导航</span>
      <span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a>
      <a href="{{ '/series/' | relative_url }}"{% if page.url == '/series/' %} aria-current="page"{% endif %}>系列</a>
      <a href="{{ '/tags/' | relative_url }}"{% if page.url == '/tags/' %} aria-current="page"{% endif %}>主题</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>关于</a>
      <a href="{{ '/feed.xml' | relative_url }}">订阅</a>
      <button class="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换深浅色主题">
        <span class="theme-icon" aria-hidden="true">◐</span>
      </button>
    </nav>
  </div>
</header>
